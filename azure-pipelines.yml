trigger:
  branches:
    include:
      - main

pool:
  name: prakash

variables:
  DOCKER_IMAGE: 'crafts-app'
  DOCKER_HUB_REPO: 'ncprakash/crafts_app'

stages:

# -------------------------------------------------------------
# STAGE 1: Git Version Check
# -------------------------------------------------------------
- stage: GitVersion
  displayName: 'Stage 1 - Git Version Check'
  jobs:
  - job: GitVersionJob
    displayName: 'Verify Git & Log History'
    workspace:
      clean: all
    steps:
    - checkout: self
    - pwsh: |
        Write-Host "===== Git Version ====="
        git --version
        Write-Host ""
        Write-Host "===== Recent Commits ====="
        git log --oneline -10
        Write-Host ""
        Write-Host "===== Current Branch ====="
        git branch -a
        Write-Host ""
        Write-Host "===== Repository Status ====="
        git status
      displayName: 'Git version and history check'

# -------------------------------------------------------------
# STAGE 2: Dependency Check
# -------------------------------------------------------------
- stage: DependencyCheck
  displayName: 'Stage 2 - Dependency Check'
  dependsOn: GitVersion
  jobs:
  - job: DependencyJob
    displayName: 'Install & Verify Dependencies'
    workspace:
      clean: all
    steps:
    - checkout: self
    - pwsh: |
        Write-Host "===== Node & npm versions ====="
        node --version
        npm --version
      displayName: 'Verify Node.js version'
    - pwsh: |
        Write-Host "===== Cleaning npm cache ====="
        npm cache clean --force
        Write-Host "===== Installing dependencies ====="
        npm ci
        Write-Host "===== Generating Prisma Client ====="
        npx prisma generate
        Write-Host "===== Installed packages ====="
        npm list --depth=0
      displayName: 'npm ci + prisma generate'
      env:
        DATABASE_URL: $(DATABASE_URL)

# -------------------------------------------------------------
# STAGE 3: Code Quality Check (ESLint + SonarQube)
# -------------------------------------------------------------
- stage: CodeQuality
  displayName: 'Stage 3 - Code Quality Check'
  dependsOn: DependencyCheck
  jobs:
  - job: LintJob
    displayName: 'ESLint + SonarQube Analysis'
    workspace:
      clean: all
    steps:
    - checkout: self
    - pwsh: |
        npm cache clean --force
        npm ci
      displayName: 'Install dependencies'
      env:
        DATABASE_URL: $(DATABASE_URL)
    - pwsh: |
        npx prisma generate
      displayName: 'Generate Prisma client'
      env:
        DATABASE_URL: $(DATABASE_URL)
    - pwsh: |
        Write-Host "===== Running ESLint ====="
        try {
          npm run lint
          Write-Host "ESLint passed with no errors."
        } catch {
          Write-Host "ESLint completed with warnings (non-blocking)."
        }
        Write-Host "===== ESLint step complete ====="
        exit 0
      displayName: 'ESLint check'
    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarQube Analysis'
      continueOnError: true
      inputs:
        SonarCloud: 'SonarCloudConnection'
        organization: 'ncprakash121'
        scannerMode: 'CLI'
        configFile: 'sonar-project.properties'
        extraProperties: |
          sonar.projectKey=ncprakash121_crafts
    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarQube Analysis'
      continueOnError: true
    - task: SonarCloudPublish@3
      displayName: 'Publish SonarQube Quality Gate'
      continueOnError: true
      inputs:
        pollingTimeoutSec: '300'

# -------------------------------------------------------------
# STAGE 4: Application Build
# -------------------------------------------------------------
- stage: AppBuild
  displayName: 'Stage 4 - Application Build'
  dependsOn: CodeQuality
  jobs:
  - job: BuildJob
    displayName: 'Next.js Production Build'
    workspace:
      clean: all
    steps:
    - checkout: self
    - pwsh: |
        npm cache clean --force
        npm ci
      displayName: 'Install dependencies'
      env:
        DATABASE_URL: $(DATABASE_URL)
    - pwsh: |
        npx prisma generate
      displayName: 'Generate Prisma client'
      env:
        DATABASE_URL: $(DATABASE_URL)
    - pwsh: |
        Write-Host "===== Building Next.js application ====="
        npm run build
        Write-Host "Build completed successfully!"
      displayName: 'npm run build'
      env:
        DATABASE_URL: $(DATABASE_URL)
        NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
        NEXTAUTH_URL: 'http://localhost:3000'
        NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
        SKIP_ENV_VALIDATION: 'true'
    - pwsh: |
        Write-Host "Cleaning node_modules and .next to free disk space..."
        Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force .next -ErrorAction SilentlyContinue
        Write-Host "Cleanup done."
      displayName: 'Free disk space after build'

# -------------------------------------------------------------
# STAGE 5: Containerization (Docker Build)
# -------------------------------------------------------------
- stage: Containerize
  displayName: 'Stage 5 - Containerization'
  dependsOn: AppBuild
  jobs:
  - job: DockerBuildJob
    displayName: 'Prepare Docker Environment'
    workspace:
      clean: all
    steps:
    - checkout: self
    - pwsh: |
        Write-Host "===== Freeing Docker space ====="
        docker system prune -af
        docker volume prune -f
        Write-Host "Docker cleanup done."
        Write-Host "===== Docker Version ====="
        docker --version
      displayName: 'Docker cleanup and version check'

# -------------------------------------------------------------
# STAGE 6: Build and Push to Docker Hub
# -------------------------------------------------------------
- stage: PushToDockerHub
  displayName: 'Stage 6 - Build and Push to Docker Hub'
  dependsOn: Containerize
  jobs:
  - job: DockerPushJob
    displayName: 'Build and Push Docker Image'
    steps:
    - checkout: self
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        command: buildAndPush
        containerRegistry: 'DockerHubConnection'
        repository: 'ncprakash/crafts_app'
        dockerfile: Dockerfile
        context: '.'
        tags: |
          $(Build.BuildId)
          latest

# -------------------------------------------------------------
# STAGE 7: Deployment
# -------------------------------------------------------------
- stage: Deploy
  displayName: 'Stage 7 - Deployment'
  dependsOn: PushToDockerHub
  jobs:
  - job: DeployJob
    displayName: 'Deploy Container'
    steps:
    - task: Docker@2
      displayName: 'Login to Docker Hub'
      inputs:
        command: login
        containerRegistry: 'DockerHubConnection'
    - pwsh: |
        Write-Host "===== Pulling latest image from Docker Hub ====="
        docker pull "ncprakash/crafts_app:latest"
        Write-Host "===== Stopping old container (if running) ====="
        docker stop crafts-container 2>$null
        docker rm crafts-container 2>$null
        Write-Host "===== Starting new container ====="
        docker run -d --name crafts-container -p 3000:3000 `
          -e DATABASE_URL="$(DATABASE_URL)" `
          -e NEXTAUTH_SECRET="$(NEXTAUTH_SECRET)" `
          -e NEXTAUTH_URL="http://localhost:3000" `
          -e NEXT_PUBLIC_APP_URL="http://localhost:3000" `
          "ncprakash/crafts_app:latest"
        Write-Host "===== Running containers ====="
        docker ps
        Write-Host "Deployment complete! App running at http://localhost:3000"
      displayName: 'docker pull and run'
      env:
        DATABASE_URL: $(DATABASE_URL)
        NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
